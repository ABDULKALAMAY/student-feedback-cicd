<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163a5c;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Feedback Form</h1>

    <form onsubmit="submitFeedback(event)">

        <label>Course Name</label>
        <input type="text" name="course" placeholder="Enter course name" required>

        <label>Faculty Name</label>
        <input type="text" name="faculty" placeholder="Enter faculty name" required>

        <label>Student Name</label>
        <input type="text" name="student" placeholder="Enter student name" required>

        <label>Register Number</label>
        <input type="text" name="register" placeholder="Enter register number" required>

        <label>Department</label>
        <input type="text" name="department" placeholder="Enter department" required>

        <label>Rating</label>
        <select name="rating" required>
            <option value="">Select rating</option>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Very Good</option>
            <option value="3">3 - Good</option>
            <option value="2">2 - Average</option>
            <option value="1">1 - Poor</option>
        </select>

        <label>Feedback / Comments</label>
        <textarea name="feedback"
                  placeholder="Enter your feedback"
                  required></textarea>

        <button type="submit">Submit Feedback</button>

    </form>

    <div id="message">
        Thank you! Your feedback has been submitted successfully.
    </div>

</div>

<script>
function submitFeedback(event) {
    event.preventDefault();

    document.getElementById("message").style.display = "block";

    event.target.reset();
}
</script>

</body>
</html>
